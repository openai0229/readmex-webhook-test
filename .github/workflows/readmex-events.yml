name: ReadmeX event push
on:
  issues:
    types: [opened, closed, reopened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, closed, ready_for_review]
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Send to ReadmeX
        env:
          URL: https://readmex.ai/api/webhooks/v1/rmx_eFsFurlI8l21ZaWk70fVnSzbN8R5XL4cs2wbhoPdoD0
          READMEX_SECRET: ${{ secrets.READMEX_WEBHOOK_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT: ${{ toJSON(github.event) }}
        run: |
          node -e '
            const crypto = require("crypto");
            const e = JSON.parse(process.env.EVENT);
            const kind = process.env.EVENT_NAME;
            let type, action, subject;
            if (kind === "issues") {
              type = "issue";
              action = ["opened", "closed", "reopened"].includes(e.action) ? e.action : "updated";
              subject = { kind: "issue", number: e.issue.number, title: e.issue.title, url: e.issue.html_url, state: e.issue.state };
            } else if (kind === "issue_comment") {
              type = "comment";
              action = "created";
              subject = { kind: "comment", number: e.issue.number, title: (e.comment.body || e.issue.title || "").replace(/\s+/g, " ").trim().slice(0, 200), url: e.comment.html_url, state: e.issue.state };
            } else {
              const pr = e.pull_request;
              type = "change_request";
              action = pr.merged ? "merged" : pr.state === "closed" ? "closed" : e.action === "opened" ? "opened" : "updated";
              subject = { kind: "change_request", number: pr.number, title: pr.title, url: pr.html_url, state: pr.merged ? "merged" : pr.state };
            }
            const body = JSON.stringify({
              type, action, subject,
              actor: { name: e.sender.login },
              occurredAt: (e.issue && e.issue.updated_at) || (e.pull_request && e.pull_request.updated_at) || new Date().toISOString(),
              extra: {},
            });
            const sig = crypto.createHmac("sha256", process.env.READMEX_SECRET).update(body).digest("hex");
            fetch(process.env.URL, {
              method: "POST",
              headers: {
                "content-type": "application/json",
                "x-readmex-delivery": process.env.GITHUB_RUN_ID + "-" + process.env.GITHUB_RUN_ATTEMPT,
                "x-readmex-signature-256": "sha256=" + sig,
              },
              body,
            }).then(async (r) => { console.log(r.status, await r.text()); if (!r.ok) process.exit(1); });
          '
